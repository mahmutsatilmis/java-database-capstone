<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Patient Dashboard</title>
    <link rel="icon" type="image/png" href="../assets/images/logo/logo.png" />
    <link rel="stylesheet" href="../assets/css/patientDashboard.css" />
    <link rel="stylesheet" href="../assets/css/style.css" />
    <script src="../js/util.js" defer></script>
    <script src="../js/render.js" defer></script>
    <script src="../js/components/header.js" defer></script>
    <script src="../js/components/footer.js" defer></script>
</head>

<body onload="renderContent()">
    <div class="container">
        <div class="wrapper">
            <div id="header"></div>

            <main class="main-content">
                <div class="dashboard-controls">
                    <input type="text" id="searchBar" placeholder="Search by doctor name" />

                    <div class="filter-row">
                        <select id="filterTime" class="filter-select">
                            <option value="">Sort by Time</option>
                            <option value="AM">AM</option>
                            <option value="PM">PM</option>
                        </select>

                        <select id="filterSpecialty" class="filter-select">
                            <option value="">Filter by Specialty</option>
                            <option value="Cardiologist">Cardiologist</option>
                            <option value="Dermatologist">Dermatologist</option>
                            <option value="Neurologist">Neurologist</option>
                            <option value="Pediatrician">Pediatrician</option>
                            <option value="Orthopedist">Orthopedist</option>
                            <option value="Dentist">Dentist</option>
                            <option value="General Physician">General Physician</option>
                        </select>
                    </div>
                </div>

                <div id="content"></div>
            </main>

            <div id="footer"></div>
        </div>
    </div>

    <div id="modal" class="modal">
        <span id="closeModal" class="close">&times;</span>
        <div id="modal-body"></div>
    </div>

    <script type="module" src="../js/patientDashboard.js" defer></script>
</body>

</html>
